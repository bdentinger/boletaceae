version: "v2025.09.01"
email: "bryn.dentinger@gmail.com"
toolname: "BoletaceaeBackbone"
taxon_query: "Boletaceae[Organism]"
update_window_days: 8

backbone_loci: [RPB1, RPB2, TEF1]   # LSU removed
coding_loci:   [RPB1, RPB2, TEF1]   # these are CDS-only loci
constraint_newick: [constraints/Trembleetal_branchlength.newick]

its_clade_rank: genus

min_seq_len:
  ITS: 300
  RPB1: 300
  RPB2: 300
  TEF1: 250

masking:
  gap_threshold: 0.7

threads:
  align: 16      # per-job MAFFT threads (tools flag)
  iqtree: "AUTO" # IQ-TREE 3 --T

classifier:
  method: sklearn
  min_confidence: 0.8

python_bin: "python3.11"
