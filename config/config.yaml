version: "v2025.08-clean"
email: "you@example.org"
tool: "BoletaceaeBackbone"
taxon_query: "Boletaceae[Organism]"
update_window_days: 8

# Loci
coding_loci: [RPB1, RPB2, TEF1]
backbone_loci: [RPB1, RPB2, TEF1]

# Optional constraint tree (Newick); set path to enable (e.g., constraints/boletaceae_constraint.nwk)
constraint_tree: ""

# Binaries
python_bin: "python3.11"
iqtree_bin: "iqtree3"

threads:
  align: 48
  iqtree: 72

speed_mode: accurate  # or "fast"

outgroup:
  prefer_single: ["Paxillus"]
  fallback_clade: ["Chalciporus","Buchwaldoboletus","Rubinoboletus"]

its_cluster:
  treecluster_threshold: 0.05
  min_len: 300
  min_seqs: 4

custom:
  preserve_labels: true
