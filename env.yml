name: boletaceae
channels: [conda-forge, bioconda, defaults]
dependencies:
  - python=3.11
  - snakemake
  - biopython
  - numpy
  - pandas
  - scikit-learn
  - joblib
  - requests
  - entrez-direct
  - mafft
  - iqtree
  - iqtree=3.*        # IQ-TREE 3
  - trimal
  - vsearch
  - itsx
  - epa-ng
  - hmmer
  - fasttree
  - ete3
  - seqkit
  - openjdk           # for MACSE
  - macse             # MACSE v2
  - pip
  - pip:
      - fastapi
      - uvicorn
      - redis
      - rq
      - jinja2
